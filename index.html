<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Tic Tac Toe | JBJ</title>
    <link rel="icon" type="image/x-icon" href="./img/jbj-logo.svg" />
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="./js/tictactoe.js" defer></script>
  </head>
  <body>
    <header>
      <div class="player-tag-1">
        <img src="./img/jbj-circle.svg" alt="First player token" />
        <p id="p1Tag">Player 1</p>
      </div>
      <div class="title-container">
        <h1>Tic Tac Toe</h1>
      </div>
      <div class="player-tag-2">
        <p id="p2Tag">Player 2</p>
        <img src="./img/jbj-cross.svg" alt="Second player token" />
      </div>
      <div class="message-container">
        <p id="messageEl">PLAYER WHOEVER's TURN</p>
      </div>
    </header>
    <main id="gameboardEl">
      <button></button>
      <button></button>

    <div></div>

</html>
