<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Tic Tac Toe | JBJ</title>
    <link rel="icon" type="image/x-icon" href="./img/jbj-logo.svg" />
    <script
      src="https://kit.fontawesome.com/e639c0bb0f.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="./css/styles.css" />
    <script src="./js/tictactoe.js" defer></script>
  </head>
  <body>
    <dialog id="startDialog">
      <h2>Choose Your Names</h2>
      <div class="dialog-center">
        <label for="p1Name">
          Player 1 Name:
          <div class="input-container">
            <img src="./img/jbj-circle.svg" alt="Player 1 token" />
            <input
              id="p1Input"
              type="text"
              placeholder="Player 1"
              maxlength="20"
            />
          </div>
        </label>
        <label for="p2Name">
          Player 2 Name:
          <div class="input-container">
            <img src="./img/jbj-cross.svg" alt="Player 2 token" />
            <input
              id="p2Input"
              type="text"
              placeholder="Player 2"
              maxlength="20"
            />
          </div>
        </label>
        <p class="validation-text" id="validationEl">
          Validation Message Here!
        </p>
        <button class="dialog-btn" id="startBtn">Start Game</button>
      </div>
    </dialog>

    <dialog id="endDialog">
      <h2 id="endTitle">Game Over</h2>
      <div class="dialog-center">
        <button class="dialog-btn" id="restartBtn">Play Again</button>
      </div>
    </dialog>

    <div class="main-grid">
      <header class="header-container">
        <div class="title-container">
          <h1 class="header-title">Tic Tac T<span>o</span>e</h1>
        </div>
        <div class="player-group">
          <div id="p1Tag" class="player-tag active">
            <img src="./img/jbj-circle.svg" alt="First player token" />
            <p>Player 1</p>
          </div>
          <div id="p2Tag" class="player-tag">
            <img src="./img/jbj-cross.svg" alt="Second player token" />
            <p>Player 2</p>
          </div>
        </div>
        <p class="header-msg" id="messageEl">Ready to play?</p>
      </header>

      <main class="board-grid" id="gameboardEl">
        <button class="board-btn"></button>
        <button class="board-btn"></button>
        <button class="board-btn"></button>
        <button class="board-btn"></button>
        <button class="board-btn"></button>
        <button class="board-btn"></button>
        <button class="board-btn"></button>
        <button class="board-btn"></button>
        <button class="board-btn"></button>
      </main>

      <footer class="footer">
        <a class="contact-link" href="https://github.com/jonasbj99">
          <i class="fa-brands fa-github"></i>
          jonasbj99
        </a>
      </footer>
    </div>
  </body>
</html>
